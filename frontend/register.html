<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Регистрация</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="static/css/style.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-box">

      <button class="theme-toggle" onclick="toggleTheme()" title="Сменить тему"
        style="position:fixed;top:20px;right:20px;z-index:10;">🌙</button>

      <h1>Регистрация</h1>
        <div id="err" class="alert alert-error hidden"></div>
        <div id="ok" class="alert alert-success hidden"></div>

          <form id="form">
            <label>ФИО</label>
            <input name="full_name" placeholder="Иванов Иван" required />

            <label>Логин</label>
            <input name="username" placeholder="ivan" required autocomplete="username" />

            <label>Email</label>
            <input type="email" name="email" placeholder="ivan@example.com" required />

            <label>Пароль</label>
            <input type="password" name="password" placeholder="минимум 4 символа" minlength="4" required autocomplete="new-password" />

            <button class="btn btn-primary">Создать аккаунт</button>
          </form>

      <p class="switch">Уже есть аккаунт? <a href="login.html">Войти</a></p>
    </div>
  </div>

  <script src="static/js/api.js"></script>
  <script>
    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = document.getElementById('err');
      const ok = document.getElementById('ok');
      err.classList.add('hidden'); ok.classList.add('hidden');
      const fd = new FormData(e.target);
      try {
        await api('/api/auth/register', {
          method: 'POST', auth: false,
          body: {
            full_name: fd.get('full_name'),
            username: fd.get('username'),
            email: fd.get('email'),
            password: fd.get('password'),
          },
        });
        ok.textContent = 'Аккаунт создан! Перенаправляем на вход...';
        ok.classList.remove('hidden');
        setTimeout(() => location.href = 'login.html', 1200);
      } catch (ex) {
        err.textContent = '' + ex.message;
        err.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
